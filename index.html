<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Annu ! ❤️🎉</title>
  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --accent-color: #ff3366;
      --accent-glow: rgba(255, 51, 102, 0.4);
      --text-main: #2b2d42;
      --text-muted: #8d99ae;
      --timeline-line: #ff85a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 15px;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: radial-gradient(#ffccd5 1px, transparent 1px);
      background-size: 25px 25px;
    }

    /* --- LOGIN PAGE STYLING --- */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #ff3366 0%, #ff758c 50%, #ffb703 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }

    .login-card {
      background: #ffffff;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(255, 51, 102, 0.3);
      text-align: center;
      width: 90%;
      max-width: 380px;
      border: 3px dashed #ff3366;
      position: relative;
    }

    .login-card::before {
      content: '🎁';
      font-size: 2.5rem;
      display: block;
      margin-bottom: 10px;
    }

    .login-card h2 {
      color: #ff3366;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .login-card p {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .login-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
      user-select: text;
    }

    .login-input:focus {
      border-color: #ff3366;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #ff3366;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
    }

    .login-btn:hover {
      background-color: #d90429;
      transform: translateY(-2px);
    }

    #main-content {
      display: none; /* Login hone ke baad hi dikhega */
    }

    /* --- PARATROOPER / FALLING CONFETTI & STARS --- */
    .party-element {
      position: fixed;
      z-index: 9998;
      top: -20px;
      animation: fallDown linear infinite;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg) scale(1.2);
        opacity: 0.2;
      }
    }

    .confetti-ribbon {
      width: 12px;
      height: 24px;
      background-color: #ff477e;
      border-radius: 3px;
    }
    .confetti-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ffb703;
    }
    .confetti-star {
      font-size: 16px;
    }

    /* --- FLOATING BALLOONS BACKGROUND ANIMATION --- */
    .floating-balloon {
      position: fixed;
      bottom: -150px;
      width: 45px;
      height: 60px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: -1;
      animation: floatUp 10s ease-in-out infinite;
      opacity: 0.8;
      box-shadow: inset -6px -6px 0px rgba(0,0,0,0.1);
    }
    .floating-balloon::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 20px;
      width: 2px;
      height: 15px;
      background-color: #888;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      50% { transform: translateY(-60vh) translateX(30px) rotate(10deg); }
      100% { transform: translateY(-120vh) translateX(-20px) rotate(-10deg); opacity: 0; }
    }

    /* --- HEADER WITH GIFT BANNER & NEON GLOW --- */
    header {
      text-align: center;
      margin: 25px 0 35px;
      position: relative;
      background: linear-gradient(135deg, #ffffff, #ffe6eb);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 51, 102, 0.15);
      border: 2px dashed var(--accent-color);
    }

    header::before {
      content: '🎁';
      font-size: 2.5rem;
      display: block;
      margin-bottom: 10px;
      animation: bounceGift 2s ease-in-out infinite;
    }

    @keyframes bounceGift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }

    header h1 {
      font-size: 2.4rem;
      color: var(--accent-color);
      margin-bottom: 8px;
      text-shadow: 2px 2px 8px var(--accent-glow);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 500;
    }

    #bg-music {
      display: none;
    }

    /* --- MUSIC WIDGET (VINYL RECORD STYLE) --- */
    .music-widget {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 9999;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        #111 0px,
        #111 3px,
        #222 4px,
        #222 6px,
        #000 7px
      );
      box-shadow: 0 8px 25px rgba(255, 51, 102, 0.4), inset 0 0 0 3px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      animation: spin 3.5s linear infinite;
      transition: transform 0.2s ease, opacity 0.3s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .music-widget::before {
      content: '🎵';
      font-size: 16px;
      width: 26px;
      height: 26px;
      background-color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .music-widget.paused {
      animation-play-state: paused;
      opacity: 0.8;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- TIMELINE DECORATION --- */
    .timeline {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 0;
    }

    .timeline::after {
      content: '';
      position: absolute;
      width: 6px;
      background: linear-gradient(to bottom, #ff3366, #ffb703, #3a86ff);
      top: 0;
      bottom: 0;
      left: 50%;
      margin-left: -3px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
    }

    .timeline-item {
      padding: 15px 30px;
      position: relative;
      background-color: inherit;
      width: 50%;
      display: none;
    }

    .timeline-item.left { left: 0; }
    .timeline-item.right { left: 50%; }

    .timeline-item::after {
      content: '🎉';
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      width: 32px;
      height: 32px;
      right: -16px;
      background-color: #fff;
      border: 3px solid var(--accent-color);
      top: 24px;
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3);
    }

    .timeline-item.right::after { left: -16px; }

    /* --- GIFT BOX STYLE CARDS --- */
    .card {
      padding: 20px;
      background-color: var(--card-bg);
      position: relative;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 2px solid #ffe3ec;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(255, 51, 102, 0.18);
      border-color: var(--accent-color);
    }

    .media-container {
      position: relative;
      width: 100%;
      cursor: pointer;
    }

    .media-container img, .media-container video {
      width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
      pointer-events: none;
    }

    .media-container.is-video::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: white;
      background: rgba(255, 51, 102, 0.85);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
      z-index: 2;
    }

    /* --- LIGHTBOX MODAL --- */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 99999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .lightbox img, .lightbox video {
      max-width: 95%;
      max-height: 90vh;
      border-radius: 12px;
      outline: none;
      pointer-events: none;
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.4);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100000;
      transition: transform 0.2s;
    }
    .lightbox-close:hover {
      transform: scale(1.1);
      color: var(--accent-color);
    }

    footer {
      text-align: center;
      margin: 60px 0 20px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      border: 1px dashed var(--accent-color);
    }

    @media screen and (max-width: 768px) {
      .timeline::after { left: 20px; }
      .timeline-item { width: 100%; padding-left: 55px; padding-right: 15px; }
      .timeline-item.right { left: 0%; }
      .timeline-item.left::after, .timeline-item.right::after { left: 5px; }
    }
  </style>
</head>

  <script>
    // Password Check Logic
    function checkPassword() {
      const inputVal = document.getElementById('password-input').value;
      const overlay = document.getElementById('login-overlay');
      const mainContent = document.getElementById('main-content');

      if (inputVal === "Annu Baby") {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
          mainContent.style.display = 'block';
          // Unlock hote hi automatic music play ho jayega (User interaction ki wajah se)
          tryPlayAudio();
        }, 500);
      } else {
        // Galat password par background solid theme colour ka ho jayega
        overlay.innerHTML = "";
        overlay.style.background = "#ff3366";
      }
    }

    // Enter key dabane par bhi login ho jaye
    document.getElementById('password-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) ||
        (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's' || e.key === 'P' || e.key === 'p'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    });

    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');

    function tryPlayAudio() {
      audio.play().then(() => {
        musicBtn.classList.remove('paused');
      }).catch(() => {});
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        musicBtn.classList.remove('paused');
      } else {
        audio.pause();
        musicBtn.classList.add('paused');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const mediaContainers = document.querySelectorAll('.media-container');

      mediaContainers.forEach(container => {
        const imgSrc = container.getAttribute('data-img');
        const videoSrc = container.getAttribute('data-video');
        const cardItem = container.closest('.timeline-item');

        let isLoaded = false;

        const tryLoadImage = () => {
          if (!imgSrc || imgSrc.trim() === '') return;
          const img = document.createElement('img');
          img.src = imgSrc;
          img.alt = "Memory";
          img.draggable = false;

          img.onload = () => {
            if (!isLoaded) {
              isLoaded = true;
              container.appendChild(img);
              container.onclick = () => openLightbox(imgSrc, false);
              cardItem.style.display = 'block';
            }
          };
        };

        if (videoSrc && videoSrc.trim() !== '') {
          const video = document.createElement('video');
          video.src = videoSrc;
          video.muted = true;
          video.playsInline = true;
          video.controlsList = "nodownload";

          video.onloadeddata = () => {
            if (!isLoaded) {
              isLoaded = true;
              container.classList.add('is-video');
              container.appendChild(video);
              video.autoplay = true;
              video.loop = true;
              video.play().catch(() => {});
              container.onclick = () => openLightbox(videoSrc, true);
              cardItem.style.display = 'block';
            }
          };

          video.onerror = () => {
            tryLoadImage();
          };
        } else {
          tryLoadImage();
        }
      });
    });

    function openLightbox(src, isVideo) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxVideo = document.getElementById('lightbox-video');

      if (isVideo) {
        lightboxImg.style.display = 'none';
        lightboxVideo.src = src;
        lightboxVideo.muted = false;
        lightboxVideo.controlsList = "nodownload";
        lightboxVideo.style.display = 'block';
        lightboxVideo.play();
      } else {
        lightboxVideo.style.display = 'none';
        lightboxVideo.pause();
        lightboxImg.src = src;
        lightboxImg.style.display = 'block';
      }

      lightbox.style.display = 'flex';
    }

    function closeLightbox(event) {
      if (event.target.tagName === 'VIDEO') return;

      const lightbox = document.getElementById('lightbox');
      const lightboxVideo = document.getElementById('lightbox-video');

      lightbox.style.display = 'none';
      lightboxVideo.pause();
      lightboxVideo.src = '';
    }
  </script>
</body>
</html>
